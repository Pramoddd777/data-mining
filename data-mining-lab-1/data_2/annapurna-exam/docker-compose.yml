services:

  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: annapurna
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: annapurna-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: